services:
  minidlna:
    build:
      context: ./minidlna

    container_name: minidlna

    restart: unless-stopped

    network_mode: host

    volumes:
      - ${HOMELAB_DATA}/minidlna:/var/cache/minidlna
      - ${MEDIA_DIR}:/media:ro

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest

    container_name: qbittorrent

    restart: unless_stopped

    environment:
        - PUID=${PUID}
        - PGID=${PGID}
        - TZ=${TZ}
        - WEBUI_PORT=8080

      ports:
        - "8080:8080"
        - "6881:6881"
        - "6881:6881/udp"

      volumes:
        - ${HOMELAB_DATA}/qbittorrent/config:/config
        - ${DOWNLOADS_DIR}:/downloads
