# Name shown to DLNA devices such as your Sony Bravia.
friendly_name=Home Media Server

# Where ReadyMedia stores its database and cache.
db_dir=/config

# Log file location.
log_dir=/config

# Store media metadata in the database.
# This prevents the server from having to rediscover everything constantly.
inotify=yes

# Listen on all available network interfaces.
network_interface=wlp0s20f3 #eth0

# Enable video.
media_dir=V,/media/movies
# media_dir=V,/media/tv

# Enable audio.
# media_dir=A,/media/music

# Enable images.
media_dir=P,/media/images

# Port used by the ReadyMedia HTTP interface.
port=8200

# Friendly DLNA server name.
serial=12345678

# Model information presented to DLNA clients.
model_number=1

# Make the server announce itself as a DLNA media server.
enable_tivo=no
